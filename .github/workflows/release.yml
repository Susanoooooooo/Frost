# Сборка установщика для Windows, APK для Android и черновика релиза на GitHub.
# Запуск: поставьте тег вида v0.9.0 и отправьте его (git push origin v0.9.0)
# или нажмите «Run workflow» на вкладке Actions.
# Версия берётся из src-tauri/tauri.conf.json, тег и название релиза: v<версия>.
# Текст релиза собирается из раздела CHANGELOG.md этой версии (scripts/release-notes.mjs):
# если раздела нет, выпуск остановится с понятной ошибкой.
# Рядом с установщиком и APK публикуются файлы .sha256: Frost сверяет их перед установкой.
# Черновик нужно опубликовать вручную: только после этого Frost увидит обновление.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Установщик для Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Найти папку проекта
        id: app
        shell: bash
        run: |
          if [ -f src-tauri/tauri.conf.json ]; then dir=.; elif [ -f frost/src-tauri/tauri.conf.json ]; then dir=frost; else echo "::error::Не найден src-tauri/tauri.conf.json"; exit 1; fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ${{ steps.app.outputs.dir }}/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.app.outputs.dir }}/src-tauri -> target

      - name: Зависимости
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm ci

      - name: Описание релиза из CHANGELOG.md
        id: notes
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          {
            echo 'body<<FROST_RELEASE_NOTES'
            node scripts/release-notes.mjs
            echo
            echo 'FROST_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ${{ steps.app.outputs.dir }}
          tagName: v__VERSION__
          releaseName: Frost v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true

      # Контрольная сумма рядом с установщиком: Frost скачивает её при обновлении
      # и отменяет установку, если файл повреждён или подменён.
      - name: SHA-256 установщика в черновик релиза
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cd src-tauri/target/release/bundle/nsis
          for f in *-setup.exe; do sha256sum "$f" | cut -d' ' -f1 | tr -d '*' > "$f.sha256"; done
          cat ./*.sha256
          gh release upload "v$version" ./*-setup.exe.sha256 --clobber --repo "$GITHUB_REPOSITORY"

  # APK для Android: тот же процесс, что и ручной запуск Android во вкладке Actions
  android:
    name: APK для Android
    uses: ./.github/workflows/android.yml
    secrets: inherit

  # Подписанный APK прикрепляется к черновику, который создал шаг Windows.
  # Без секретов подписи шаг пропускается: отладочный APK остаётся только в артефактах.
  android-release:
    name: APK в черновик релиза
    needs: [windows, android]
    if: needs.android.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.android.outputs.artifact }}
          path: apk

      - name: Прикрепить APK и его SHA-256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.android.outputs.version }}
        run: |
          cd apk
          for f in *.apk; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done
          cat ./*.sha256
          gh release upload "$TAG" ./*.apk ./*.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
